*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}.brand{font-weight:700;font-size:16px;color:var(--pr)}.brand small{display:block;font-weight:400;color:var(--mu);font-size:11px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}nav button.on{background:var(--blb);color:var(--bl)}
main{max-width:1200px;margin:0 auto;padding:16px}

.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;overflow:hidden}.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);padding:10px 12px;background:var(--in);border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--in)}

.b{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.red{background:var(--rdb);color:var(--rd)}.orange{background:var(--orb);color:var(--or)}.yellow{background:var(--yeb);color:var(--ye)}.green{background:var(--grb);color:var(--gr)}.gray{background:var(--gyb);color:var(--gy)}.blue{background:var(--blb);color:var(--bl)}
.t{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.kp b{display:block;font-size:26px;line-height:1.1}.kp span{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}.card h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--bd)}
.pg{height:8px;background:var(--gyb);border-radius:9px;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:var(--gr)}
.hb{display:flex;align-items:center;gap:8px;padding:6px 14px}.hb span{flex:1}.hb .pg{flex:1;margin:0}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);padding:0;width:min(640px,94vw);max-height:90vh}dialog::backdrop{background:#0008}
.mh{padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:700;font-size:16px}.mb{padding:16px 18px;overflow:auto;max-height:68vh}.mf{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .w{grid-column:1/-1}label{font-size:12px;font-weight:600;color:var(--mu);display:block}label>*{margin-top:4px;font-weight:400}
@media(max-width:560px){.g{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pr);color:var(--pt);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
a{color:var(--bl);text-decoration:none}.rule{background:var(--blb);color:var(--bl);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=t=>t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());
const today=()=>ymd(new Date()),D=d=>new Date(d+"T00:00"),add=(d,n)=>{const t=D(d);t.setDate(t.getDate()+n);return ymd(t)},diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const fmt=d=>d?D(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"-";
const DEF={outcomes:[["Interested - sample/quote needed",3,"Send catalogue / quote on WhatsApp, follow up"],["Interested - no current requirement",30,"Add to season reminder"],["Not reachable",1,"Retry at another time, then WhatsApp (max 3 attempts)"],["Callback requested",1,"Call exactly when promised"],["Price/terms objection",3,"Escalate to Head of Sales for a decision"],["Order received - hand over to operations",7,"Fill handover sheet, confirm delivery plan"],["Not interested",180,"Log the reason, review in 6 months"],["Wrong contact/number",2,"Find the right person and update details"]],tiers:{A:14,B:45,C:90},types:["Brand","Wholesaler","Exporter","Retailer","Institutional / Uniform","Agent / Buying house","Other"],callTypes:["Startup call","Follow-up call","Visit","Video call","WhatsApp / Email"]};
let db,S={clients:[],calls:[],cfg:DEF},view="today",q="",F={tier:"",owner:"",status:""},chip="";
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open("vvk_crm",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("clients",{keyPath:"id",autoIncrement:true});d.createObjectStore("calls",{keyPath:"id",autoIncrement:true});d.createObjectStore("cfg",{keyPath:"k"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const P=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)}),T=(s,m)=>db.transaction(s,m||"readonly").objectStore(s);
const all=s=>P(T(s).getAll()),put=(s,o)=>P(T(s,"readwrite").put(o)),rm=(s,id)=>P(T(s,"readwrite").delete(id)),clr=s=>P(T(s,"readwrite").clear());
async function load(){S.clients=await all("clients");S.calls=await all("calls");const c=await P(T("cfg").get("main"));S.cfg=c||DEF}
async function seed(){if(await P(T("cfg").get("main")))return;const ids={};for(const r of SEED.c){const [name,tier,owner,contact,phone,city,type,oDate,oVal,last,outcome,action,next,notes]=r;ids[name]=await put("clients",{name,tier,owner,contact,phone,city,type,oDate,oVal,last,outcome,action,next,notes})}
for(const [n,date,type,outcome,sum,action,next] of SEED.l)await put("calls",{cid:ids[n],date,type,outcome,sum,action,next});await put("cfg",{k:"main",...DEF})}
const stat=c=>{const t=today();return !c.next?"NO DATE":c.next<t?"OVERDUE":c.next===t?"DUE TODAY":diff(c.next,t)<=7?"THIS WEEK":"UPCOMING"};
const gapx=c=>!c.last?"NEVER":diff(today(),c.last)>(S.cfg.tiers[c.tier]||90)?"EXCEEDED":"OK";
const due=c=>["OVERDUE","DUE TODAY","NO DATE"].includes(stat(c))||gapx(c)!=="OK";
const col={OVERDUE:"red","DUE TODAY":"orange","THIS WEEK":"yellow",UPCOMING:"green","NO DATE":"gray"},tc={A:"red",B:"blue",C:"gray"};

function render(){$("#nav").innerHTML=NAV.map(([k,l])=>`<button class="${k===view?"on":""}" onclick="go('${k}')">${l}</button>`).join("");({today:vList,clients:vList,log:vLog,dash:vDash,set:vSet})[view]()}
function opts(a,v,blank){return (blank?`<option value="">${blank}</option>`:"")+a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}
function vList(){const td=view==="today";$("#app").innerHTML=(td?`<div class="rule"><b>The one rule:</b> no call ends without a next action and a next follow-up date. Clients drop off this list once they have a future date.</div><div class="chips" id="chips"></div>`:"")+`<div class="bar"><input id="q" placeholder="Search name, city, contact, phone" value="${esc(q)}" oninput="q=this.value;fill()"><select onchange="F.tier=this.value;fill()">${opts(["A","B","C"],F.tier,"All tiers")}</select><select onchange="F.owner=this.value;fill()">${opts(owners(),F.owner,"All owners")}</select>${td?"":`<select onchange="F.status=this.value;fill()">${opts(["OVERDUE","DUE TODAY","THIS WEEK","UPCOMING","NO DATE"],F.status,"All statuses")}</select>`}</div><div class="card sc" id="tbl"></div>`;fill()}
function fill(){const td=view==="today",ql=q.toLowerCase();let r=S.clients.filter(c=>(!F.tier||c.tier===F.tier)&&(!F.owner||c.owner===F.owner)&&(!ql||[c.name,c.city,c.contact,c.phone].join(" ").toLowerCase().includes(ql)));

const rk=c=>({OVERDUE:0,"DUE TODAY":1})[stat(c)]??(gapx(c)==="EXCEEDED"?2:3);r.sort((a,b)=>rk(a)-rk(b)||(a.tier||"Z").localeCompare(b.tier||"Z")||(a.next||"9").localeCompare(b.next||"9")||a.name.localeCompare(b.name));

const o={...(cl(id)||{}),name,tier:g("tier"),owner:g("owner"),contact:g("contact"),phone:g("phone"),city:g("city"),type:g("type"),oDate:g("oDate"),oVal:g("oVal"),next:g("next"),notes:g("notes")};await put("clients",o);await load();shut();render();toast("Client saved")}
async function delClient(id){await rm("clients",id);for(const x of S.calls.filter(x=>x.cid===id))await rm("calls",x.id);await load();shut();render()}
function callForm(id){const c=cl(id),t=today();modal("Log call - "+esc(c.name),`<div class="g"><label>Date<input id="c_date" type="date" value="${t}" onchange="auto()"></label><label>Call type<select id="c_type">${opts(S.cfg.callTypes,c.last?"Follow-up call":"Startup call")}</select></label><label class="w">Outcome<select id="c_out" onchange="auto(1)">${opts(S.cfg.outcomes.map(o=>o[0]),"")}</select></label><label class="w">Discussion summary<textarea id="c_sum" rows="3"></textarea></label><label class="w">Next action *<input id="c_act"></label><label>Next follow-up date *<input id="c_next" type="date"></label><div class="sub" id="c_hint" style="align-self:end"></div></div>`,`<button class="btn o" onclick="shut()">Cancel</button><button class="btn" onclick="saveCall(${id})">Save call</button>`);auto(1)}
function auto(a){const o=S.cfg.outcomes.find(x=>x[0]===$("#c_out").value);if(!o)return;$("#c_next").value=add($("#c_date").value||today(),+o[1]);if(a&&!$("#c_act").dataset.m)$("#c_act").value=o[2];$("#c_hint").textContent=`Standard gap: ${o[1]} day(s)`}
async function saveCall(id){const g=k=>$("#c_"+k).value.trim();if(!g("next")||!g("act"))return toast("Next action and next follow-up date are required");const c=cl(id),d=g("date");
await put("calls",{cid:id,date:d,type:g("type"),outcome:g("out"),sum:g("sum"),action:g("act"),next:g("next")});if(!c.last||d>=c.last)Object.assign(c,{last:d,outcome:g("out"),action:g("act"),next:g("next")});await put("clients",c);await load();shut();render();toast("Call logged - client updated")}
function vLog(){$("#app").innerHTML=`<div class="bar"><input placeholder="Search call log" value="${esc(q)}" oninput="q=this.value;fillLog()"></div><div class="card sc" id="tbl"></div>`;fillLog()}
function fillLog(){const ql=q.toLowerCase(),r=S.calls.filter(x=>!ql||[cl(x.cid)?.name,x.sum,x.outcome].join(" ").toLowerCase().includes(ql)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
$("#tbl").innerHTML=r.length?`<table><thead><tr><th>Date</th><th>Client</th><th>Type</th><th>Outcome</th><th>Summary</th><th>Next action</th><th>Next date</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td>${fmt(x.date)}</td><td class="nm" onclick="clientForm(${x.cid})">${esc(cl(x.cid)?.name||"(deleted)")}</td><td>${esc(x.type)}</td><td>${esc(x.outcome)}</td><td>${esc(x.sum)}</td><td>${esc(x.action)}</td><td>${fmt(x.next)}</td><td><button class="btn o s" onclick="sure(this,()=>delCall(${x.id}))">Delete</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No calls logged yet. Use “Log call” on any client.</div>`}
async function delCall(id){await rm("calls",id);await load();fillLog()}
function vDash(){const C=S.clients,n=C.length,by=f=>C.filter(f).length,ct=by(c=>c.last),pc=n?Math.round(ct/n*100):0,t=today();
const K=[["Total clients",n,""],["Contacted at least once",ct,"green"],["Never contacted",by(c=>!c.last),"blue"],["No follow-up date (target 0)",by(c=>!c.next),"gray"],["Overdue",by(c=>stat(c)==="OVERDUE"),"red"],["Due today",by(c=>stat(c)==="DUE TODAY"),"orange"],["Due in next 7 days",by(c=>stat(c)==="THIS WEEK"),"yellow"],["Contact gap exceeded",by(c=>gapx(c)==="EXCEEDED"),"red"]];
const grp=(keys,fn)=>keys.map(k=>{const L=C.filter(c=>fn(c)===k);return `<tr><td><b>${esc(k)||"(blank)"}</b></td><td>${L.length}</td><td>${L.filter(c=>c.last&&diff(t,c.last)<=30).length}</td><td>${L.filter(c=>stat(c)==="OVERDUE").length}</td><td>${L.filter(c=>!c.next).length}</td><td>${L.filter(c=>!c.last).length}</td></tr>`}).join(""),th="<thead><tr><th></th><th>Clients</th><th>Contacted 30d</th><th>Overdue</th><th>No date</th><th>Never contacted</th></tr></thead>";
const oc=S.cfg.outcomes.map(o=>[o[0],C.filter(c=>c.outcome===o[0]).length]),mx=Math.max(1,...oc.map(x=>x[1]));
$("#app").innerHTML=`<div class="kp">${K.map(([l,v,c])=>`<div><b ${c?`class="${c}" style="background:none"`:""}>${v}</b><span>${l}</span></div>`).join("")}</div><div class="card" style="padding:12px 14px">Startup call progress: <b>${ct} of ${n} (${pc}%)</b><div class="pg"><i style="width:${pc}%"></i></div></div>
<div class="two"><div class="card sc"><h3>By tier</h3><table>${th}<tbody>${grp(["A","B","C"],c=>c.tier)}</tbody></table></div><div class="card sc"><h3>By owner</h3><table>${th}<tbody>${grp(owners(),c=>c.owner)}</tbody></table></div></div>
<div class="card" style="margin-top:14px;padding-bottom:8px"><h3>Latest call outcome across clients</h3>${oc.map(([o,v])=>`<div class="hb"><span>${esc(o)}</span><div class="pg"><i style="width:${v/mx*100}%;background:var(--pr)"></i></div><b>${v}</b></div>`).join("")}</div>`}
function vSet(){const c=S.cfg;$("#app").innerHTML=`<div class="two" style="margin-top:0"><div class="card"><h3>Follow-up rules</h3><div class="mb"><div class="sub">Default days to next follow-up per outcome (used to suggest the date when logging a call)</div>${c.outcomes.map((o,i)=>`<div class="hb" style="padding:4px 0"><span>${esc(o[0])}</span><input id="s_o${i}" type="number" min="0" value="${o[1]}" style="width:80px"></div>`).join("")}<div class="sub" style="margin-top:12px">Maximum days allowed between contacts per tier</div>${["A","B","C"].map(k=>`<div class="hb" style="padding:4px 0"><span>Tier ${k}</span><input id="s_t${k}" type="number" min="1" value="${c.tiers[k]}" style="width:80px"></div>`).join("")}<br><button class="btn" onclick="saveCfg()">Save rules</button></div></div>
<div class="card"><h3>Backup & restore</h3><div class="mb"><p class="sub">Data is stored in this browser’s IndexedDB on this device only. Copy the backup text into a safe file regularly; paste it below to restore on any device.</p><textarea id="bk" rows="6" readonly></textarea><div class="bar" style="margin:8px 0"><button class="btn" onclick="cp()">Copy backup</button></div><label>Restore: paste backup text<textarea id="rs" rows="4"></textarea></label><br><button class="btn d" onclick="sure(this,restore)">Restore (replaces all data)</button></div></div></div>`;$("#bk").value=JSON.stringify({clients:S.clients,calls:S.calls,cfg:S.cfg})}
async function saveCfg(){const c=S.cfg;c.outcomes.forEach((o,i)=>o[1]=+$("#s_o"+i).value||0);["A","B","C"].forEach(k=>c.tiers[k]=+$("#s_t"+k).value||1);await put("cfg",{k:"main",...c});toast("Rules saved")}
async function cp(){const e=$("#bk");e.select();try{await navigator.clipboard.writeText(e.value);toast("Backup copied")}catch{document.execCommand("copy");toast("Backup selected - press Ctrl+C")}}
async function restore(){try{const j=JSON.parse($("#rs").value);if(!Array.isArray(j.clients))throw 0;for(const s of["clients","calls"]){await clr(s);for(const o of j[s]||[])await put(s,o)}await put("cfg",{k:"main",...(j.cfg||DEF)});await load();render();toast("Backup restored")}catch{toast("That is not a valid backup")}}
(async()=>{try{db=await open();await seed();await load()}catch(e){toast("Storage unavailable - changes will not be saved")}render()})();
</script></body></html>
